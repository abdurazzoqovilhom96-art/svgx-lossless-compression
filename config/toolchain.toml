# Pinned build toolchain and external tool acquisitions.
# Pin policy (decision D-01): on 2026-11-13 choose the newest release that is at least two weeks old;
# verify SHA-256 on every acquisition. Values marked "upstream" were published by the project
# (GitHub release digest or .sha256 file); values marked "first-acquisition" were computed by this
# project on 2026-11-13 and are enforced thereafter.

[python]
version = "3.13"
launcher = "py"
# pip/pip-compile only consider distributions uploaded before this instant (decision D-01).
uploaded_prior_to = "2026-10-30T00:00:00Z"

[rust]
toolchain = "1.99.0"          # released 2026-10-01 (1.100.0 of 2026-11-12 is too recent)
host = "x86_64-pc-windows-gnu"
profile = "minimal"

